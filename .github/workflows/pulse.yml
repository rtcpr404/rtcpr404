# Redraws the profile artwork once a day from the public contribution calendar.
# It uses the token GitHub gives every workflow run; there is nothing to set up.
name: Refresh pulse

on:
  schedule:
    - cron: "23 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/pulse.yml"

permissions:
  contents: write

concurrency:
  group: pulse
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # Only when scripts/glyphs.json is missing: trace the letter outlines from the two typefaces.
      - name: Trace the letter outlines
        if: hashFiles('scripts/glyphs.json') == ''
        run: |
          npm install --silent --no-audit --no-fund --prefix "$RUNNER_TEMP/type" @fontsource/unbounded@5.3.0 @fontsource/dm-mono@5.3.0
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet fonttools==4.67.0
          "$RUNNER_TEMP/venv/bin/python" scripts/glyphs.py "$RUNNER_TEMP/type/node_modules/@fontsource"

      - name: Draw the artwork
        run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_LOGIN: ${{ github.repository_owner }}

      - name: Commit when something changed
        run: |
          git add assets scripts/glyphs.json scripts/OFL.txt
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh profile artwork"
            git push
          fi
